<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Steel coil processing line inside a factory</title>
  <desc id="desc">Flat vector illustration of a worker at a green and white control console with monitors, steel machinery, rollers, overhead lighting, and a concrete factory floor.</desc>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef3f1"/>
      <stop offset="1" stop-color="#c8d1cd"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b8c0bd"/>
      <stop offset="1" stop-color="#8f9996"/>
    </linearGradient>
    <linearGradient id="machineGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3f8465"/>
      <stop offset="1" stop-color="#22604a"/>
    </linearGradient>
    <linearGradient id="consoleGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f9571"/>
      <stop offset="1" stop-color="#2d6b52"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eff4f2"/>
      <stop offset="0.45" stop-color="#aeb9b6"/>
      <stop offset="0.75" stop-color="#707d7a"/>
      <stop offset="1" stop-color="#d8dfdc"/>
    </linearGradient>
    <linearGradient id="lightGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#2f3a37" flood-opacity="0.22"/>
    </filter>
    <filter id="smallShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#2f3a37" flood-opacity="0.22"/>
    </filter>
    <pattern id="floorLines" width="120" height="80" patternUnits="userSpaceOnUse">
      <path d="M0 78H120" stroke="#d8dddb" stroke-opacity="0.24" stroke-width="2"/>
      <path d="M118 0V80" stroke="#6d7774" stroke-opacity="0.15" stroke-width="2"/>
    </pattern>
  </defs>

